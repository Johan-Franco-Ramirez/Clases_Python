# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = alembic

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# path_separator
path_separator = os

# database URL. Aquí configuramos la conexión a tu base de datos SQLite.
sqlalchemy.url = sqlite:///./device_systems_usuarios.db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S